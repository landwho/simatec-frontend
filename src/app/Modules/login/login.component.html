<div class="container">
    <div class="d-flex justify-content-center align-items-center h-100vh">
       
        <form (ngSubmit)="onSubmit()" [formGroup]="loginForm">
            <p-panel header="Login Example">
                <div class="ui-grid ui-grid-responsive ui-grid-pad ui-fluid" style="margin: 10px 10px">
                    <div class="ui-grid-row">
                        <div class="ui-grid-col-2">
                            Login:
                        </div>
                        <div class="ui-grid-col-6">
                            <input pInputText type="text" formControlName="usuario" class="form-control" name="usuario">
                        </div>
                        <div class="ui-grid-col-4">
                            <div [hidden]="loginForm.controls['usuario'].valid || !loginForm.controls['usuario'].dirty" class="alert alert-danger">
                                Login is required
                            </div>
                        </div>
                    </div>
                    <div class="ui-grid-row">
                        <div class="ui-grid-col-2">
                            Password:
                        </div>
                        <div class="ui-grid-col-6">
                            <input pInputText type="password" formControlName="password" class="form-control" name="password">
                        </div>
                        <div class="ui-grid-col-4">
                            <div [hidden]="loginForm.controls['password'].valid || !loginForm.controls['password'].dirty" class="alert alert-danger">
                                Password is required
                            </div>
                        </div>
                    </div>
                    <div class="ui-grid-row">
                        <br>
                        <div class="ui-grid-col-2"></div>
                        <div class="ui-grid-col-6">
                            <button pButton type="submit" label="Submit" [disabled]="!loginForm.valid"></button>
                        </div>
                        <div class="ui-grid-col-4"></div>
                    </div>
                </div>
            </p-panel>
        </form>
     
    </div>
</div>
