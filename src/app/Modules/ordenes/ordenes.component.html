<div class="container-fluid">
 
    <h1>ordenes</h1>



    <table mat-table [dataSource]="dataSource">

            <ng-container matColumnDef="idorder">
    <th mat-header-cell *matHeaderCellDef> ID </th>
    <td mat-cell *matCellDef="let element"> {{element.idorder}} </td>
  </ng-container>

    <ng-container matColumnDef="ordernumber">
    <th mat-header-cell *matHeaderCellDef> Orden </th>
    <td mat-cell *matCellDef="let element"> {{element.ordernumber}} </td>
  </ng-container>

    <ng-container matColumnDef="dateorder">
        <th mat-header-cell *matHeaderCellDef> Fecha </th>
        <td mat-cell *matCellDef="let element">
        {{element.dateorder}}
        </td>
    </ng-container>

  <ng-container matColumnDef="patientname">
    <th mat-header-cell *matHeaderCellDef> Paciente </th>
    <td mat-cell *matCellDef="let element"> {{element.patientname}} </td>
  </ng-container>

  <ng-container matColumnDef="patientcode">
    <th mat-header-cell *matHeaderCellDef> codigo </th>
    <td mat-cell *matCellDef="let element"> {{element.patientcode}} </td>
  </ng-container>

   <ng-container matColumnDef="status">
    <th mat-header-cell *matHeaderCellDef> status </th>
    <td mat-cell *matCellDef="let element"> {{element.status}} </td>
  </ng-container>



  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

</table>




</div>
